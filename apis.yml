name: Smilobaby
description: 'Smilo (Smilobaby) is a direct-to-consumer baby and toddler products brand founded in 2016
  and based in Boston, backed by Norwest Venture Partners. Products are developed by doctors, scientists
  and engineers and sold direct via smilobaby.com, spanning bottle feeding, pacifiers and teethers,
  pregnancy and nursing, nursery, mealtime and bath. Its hero products are a pediatric-dentist-designed
  pacifier that supports a baby''s developing palate and a patented-nipple bottle with an extra-sensitive
  vent that simulates breastfeeding. This is a consumer e-commerce retail brand: it publishes no public
  developer API, developer portal, or OpenAPI, so the enrichment pass records identity and domain-security
  posture only.'
